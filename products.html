<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Products | Furbz Sparkle</title><link rel="stylesheet" href="../assets/style.css"><link rel="stylesheet" href="admin.css"></head><body><div class="admin-layout"><aside class="admin-sidebar"><a class="brand" href="../index.html"><span>FURBZ</span><small>ADMIN</small></a><nav><a href="index.html">Dashboard</a><a class="active" href="products.html">Products</a><a href="orders.html">Orders</a><a href="media.html">Media Library</a><a href="inbox.html">Inbox</a><a href="settings.html">Settings</a><a href="secrets.html">Secrets</a><a href="social-media.html">Social Media</a></nav><button class="logout" onclick="logout()">↪ <span>Logout</span></button></aside><main class="admin-main"><div class="admin-top"><h1>Products</h1><button class="btn btn-gold" onclick="openForm()">+ Add product</button></div><div class="admin-panel"><div class="table-wrap"><table><thead><tr><th>Product</th><th>Price</th><th>Old price</th><th>Stock</th><th>Category</th><th>Availability</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div></main></div><div id="modal" class="modal"><div class="modal-box"><h2 id="modalTitle">Add product</h2><form id="productForm"><input type="hidden" id="pid"><div class="form-grid"><input id="name" placeholder="Product name" required><select id="category"><option>Necklaces</option><option>Earrings</option><option>Bracelets</option><option>Rings</option><option>Sets</option></select><input id="price" type="number" placeholder="Price" required><input id="oldPrice" type="number" placeholder="Old price"><input id="stock" type="number" min="0" placeholder="Stock" required><input id="image" placeholder="Image URL (optional)"><textarea id="description" class="wide" placeholder="Description"></textarea></div><label><input id="available" type="checkbox" checked> Available</label><div style="display:flex;gap:10px"><button class="btn
