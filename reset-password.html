<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Reset Admin Password | Furbz Sparkle</title><link rel="stylesheet" href="../assets/style.css"><link rel="stylesheet" href="admin.css"></head><body class="admin-login"><div class="login-box"><a class="brand" href="../index.html"><span>FURBZ</span><small>SPARKLE</small></a><p class="eyebrow">PASSWORD RESET</p><h1>Set a new password.</h1><form id="resetForm"><input id="newPassword" type="password" minlength="8" placeholder="New password" required><input id="confirmPassword" type="password" minlength="8" placeholder="Confirm password" required><button class="btn btn-gold full">Update password</button><p id="resetMsg" class="error"></p></form></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/supabase-config.js"></script><script>document.getElementById("resetForm").addEventListener("submit",async e=>{e.preventDefault();let m=document.getElementById("resetMsg");if(newPassword.value!==confirmPassword.value)return m.textContent="Passwords do not match.";const {error}=await furbzSupabase.auth.updateUser({password:newPassword.value});m.textContent=error?error.message:"Password updated. You can now sign in.";if(!error)setTimeout(()=>location.href="login.html",1200)})</script></body></html>
